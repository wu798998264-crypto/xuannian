name: Build XuanNian for macOS

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      checks_only:
        description: Run native UI and import checks without building packages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ARCH: ${{ matrix.arch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Prepare native Java and media tools
        if: ${{ !inputs.checks_only }}
        run: node scripts/prepare-media-resources.cjs
      - name: Run favorites and performance regression checks
        run: npm run test:performance
      - name: Verify shared backup archives and window controls
        run: |
          node tests/favorites-archive.js
          npx electron tests/mac-window-controls-electron.js
          npx electron tests/music-embedded-search-probe.js
          npx electron tests/media-progress-electron.js
          npx electron tests/mac-quick-panel-electron.js
      - name: Create macOS icon
        if: ${{ !inputs.checks_only }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mac/icon.iconset
          source=src/xuannian-logo-256.png
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$source" --out "build/mac/icon.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z "$double" "$double" "$source" --out "build/mac/icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns build/mac/icon.iconset -o build/mac/icon.icns
      - name: Create macOS configuration
        if: ${{ !inputs.checks_only }}
        run: node scripts/create-macos-config.cjs
      - name: Build signed DMG and updater ZIP
        if: ${{ !inputs.checks_only }}
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config build/electron-builder.mac.generated.json
      - name: Verify packaged application and disk image
        if: ${{ !inputs.checks_only }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          app="$(find dist-mac -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app"
          node scripts/macos-after-sign.cjs "$app" "$version" "$ARCH"
          hdiutil verify "dist-mac/XuanNian-$version-$ARCH.dmg"
          test -s "dist-mac/XuanNian-$version-$ARCH.zip"
          test -s dist-mac/latest-mac.yml
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.checks_only }}
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist-mac/XuanNian-*.dmg
            dist-mac/XuanNian-*.zip
            dist-mac/*.blockmap
            dist-mac/latest-mac.yml
          if-no-files-found: error

  combine:
    if: ${{ !inputs.checks_only }}
    name: Merge verified Mac update files
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: macos-artifacts
      - name: Merge both updater architectures
        run: node scripts/merge-macos-artifacts.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-mac/*
          if-no-files-found: error
